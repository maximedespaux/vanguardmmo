    <path d="M 768 528 L 728 602 L 728 559 L 745 528 Z" fill="#4A1023"/>
    <path d="M 728 602 L 688 528 L 711 528 L 728 559 Z" fill="#7A1830"/>
    <path d="M 728 497 L 745 528 L 728 559 L 711 528 Z" fill="#B32236"/>
    <path d="M 728 497 L 711 528 L 728 528 Z" fill="#F08A92"/>
    <path d="M 728 454 L 768 528 L 728 602 L 688 528 Z" fill="none" stroke="#E6C48A" stroke-width="3" stroke-linejoin="miter"/>
  </g>
</g>
</svg>
