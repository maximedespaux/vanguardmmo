# Déploiement prod — PostgreSQL + migrations + site Next.js + bot Discord.
# Lancement : docker compose -f docker-compose.prod.yml up -d --build
# Le site écoute sur le port 3000 (à router via Nginx Proxy Manager + SSL).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vanguard_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot : crée/maj les tables avant de lancer le site et le bot.
  migrate:
    build: .
    image: vanguard-app:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --skip-generate"
    restart: "no"

  web:
    image: vanguard-app:latest
    container_name: vanguard-web
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: npm start
    # 3000 lié à localhost (debug SSH) ; le trafic public passe par NPM via le réseau interne.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - npm
    # Les vidéos de débrief des Chambres (SPEC-CHAMBRES-RECENSEMENT §10.2) : un volume nommé, jamais
    # dans public/ (servi à tous sans garde). Le site les écrit et les sert (routes /api/videos/*).
    volumes:
      - vanguard_videos:/app/data/videos
    restart: unless-stopped

  bot:
    image: vanguard-app:latest
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: npx tsx bot/index.ts
    # Le même volume : le bot le purge chaque nuit à 4 h 30 (fichiers trop anciens, envois abandonnés).
    volumes:
      - vanguard_videos:/app/data/videos
    restart: unless-stopped

volumes:
  vanguard_db:
  # Hors de la sauvegarde de la base : à sauvegarder à part si on y tient (DEPLOY.md).
  vanguard_videos:

# Réseau du Nginx Proxy Manager (déjà présent sur le VPS) : permet à NPM de
# router vanguardhub.fr → conteneur "vanguard-web" (port 3000) en interne.
networks:
  npm:
    name: nginx-proxy-manager_default
    external: true
